name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml on tags

jobs:
  js:
    name: Hook + installer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: Lua lint (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck
      - run: luacheck awesome/ spec/ demo/ e2e/

  lua:
    name: Renderer + saver (Lua 5.4, busted)
    runs-on: ubuntu-latest
    # Arch ships Lua 5.4 with lgi (cairo/GLib/GdkPixbuf bindings), same as the desktop it targets.
    container: archlinux:latest
    steps:
      - name: Install Lua 5.4, lgi and busted
        # git: without it actions/checkout falls back to the REST tarball, which honours
        # .gitattributes export-ignore and drops spec/.
        run: pacman -Syu --noconfirm --needed git lua54 lua54-lgi lua54-busted cairo gdk-pixbuf2
      - uses: actions/checkout@v4
      - name: Test
        run: lua5.4 -e 'require("busted.runner")({ standalone = false })'

  e2e:
    name: End-to-end (installer → hook → renderer, Lua 5.4/5.1/LuaJIT)
    runs-on: ubuntu-latest
    # Real install into a throwaway HOME, the installed hook commands fed Claude Code-shaped
    # events, then every layout drawn from those files by each Lua the lock-screen saver may use.
    container: archlinux:latest
    steps:
      - name: Install Node, Lua 5.4/5.1/LuaJIT and lgi
        run: pacman -Syu --noconfirm --needed git nodejs lua54 lua54-lgi lua51 lua51-lgi luajit cairo gdk-pixbuf2
      - uses: actions/checkout@v4
      - run: e2e/run.sh lua5.4 lua5.1 luajit
